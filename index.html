  const d = r.detail || {};
  const rights = r.detail
    ? `인수 권리 ${d.assumedRight ?? "-"} · 대항력 임차인 ${d.assumedTenant ?? "-"} · 확인 필요 임차인 ${d.uncertainTenant ?? "-"}${d.share ? "<br><b style='color:" + css("--risky") + "'>지분 표기 있음 — 지분경매인지 확인</b>" : ""}`
    : "권리 미조회 (감정가 4.5억 초과)";
  return `<div class="pop-h">${r.address}</div>
    <span class="pop-k">${r.case} · ${r.type}</span><br>
    감정가 <b>${fmt(r.appraised)}</b> · 최저 <b>${fmt(r.lowest)}</b> (${r.ratio ?? "-"}%)<br>
    유찰 ${r.failures}회 · 매각기일 <b>${r.date || "미정"}</b><br>
    건물 ${r.bldg ?? "-"}㎡ · 대지 ${r.land ?? "-"}㎡${d.year ? " · " + d.year + "년" : ""}<br>
    ${rights}<br>
    ${r.zone ? `<span class="tag t-zone">${r.zone} 반경 안(대략)</span><br>` : ""}
    <a href="https://m.richgo.ai/auctionMobile/${r.id}" target="_blank" rel="noopener">리치고 상세 →</a>`;
}

function visible(r) {
  return r.appraised <= state.max && state.sggs.has(r.sgg) && state.statuses.has(r.status)
    && (!state.zoneOnly || r.zone) && (!state.newOnly || r.new);
}

function render() {
  renderListings();
  markerLayer.clearLayers(); markers.clear();
  const rows = DATA.rows.filter(visible).sort((a, b) => (a.date || "9").localeCompare(b.date || "9"));
  rows.forEach(r => {
    if (r.lat == null) return;
    const m = L.circleMarker([r.lat, r.lng], {
      radius: r.zone ? 8 : 6, weight: r.zone ? 2.5 : 1, color: r.zone ? css("--zone") : "#ffffff",
      fillColor: css("--" + r.status), fillOpacity: 0.9,
    }).bindPopup(popup(r));
    m.addTo(markerLayer); markers.set(r.id, m);
  });
  const list = document.getElementById("list");
  list.innerHTML = rows.length ? rows.map(r => `
    <div class="row" data-id="${r.id}">
      <div class="l1"><span>${r.emd} ${r.type}</span><span class="tag ${STATUS[r.status].cls}">${STATUS[r.status].label}</span>
        ${r.zone ? '<span class="tag t-zone">구역</span>' : ""}${r.new ? '<span class="tag t-new">신규</span>' : ""}</div>
      <div class="l2">${r.address}</div>
      <div class="l3">감정 ${fmt(r.appraised)} → 최저 ${fmt(r.lowest)} (${r.ratio ?? "-"}%) · 유찰 ${r.failures} · ${r.date || "미정"}${r.lat == null ? " · 좌표 없음" : ""}</div>
    </div>`).join("") : `<div class="empty">조건에 맞는 물건이 없어요.</div>`;
  list.querySelectorAll(".row").forEach(el => el.addEventListener("click", () => {
    const m = markers.get(el.dataset.id);
    if (m) { map.setView(m.getLatLng(), 16); m.openPopup(); }
  }));
  const all = DATA.rows;
  document.getElementById("stats").innerHTML = `
    <span>표시 <b>${rows.length}</b>건</span>
    <span>4억 이하·권리 깨끗 <b>${all.filter(r => r.status === "clean" && r.appraised <= 4e8).length}</b>건</span>
    <span>관심 구역 반경 안 <b>${all.filter(r => r.zone).length}</b>건</span>
    <span>신규 <b>${all.filter(r => r.new).length}</b>건</span>
    <span>◆ 관심 매물 <b>${DATA.listings.filter(l => l.verdict !== "제외").length}</b>건</span>`;
  persist();
}

function chip(label, pressed, onClick, dot) {
  const b = document.createElement("button");
  b.className = "chip"; b.setAttribute("aria-pressed", pressed);
  b.innerHTML = (dot ? `<span class="dot" style="background:${css(dot)}"></span>` : "") + label;
  b.addEventListener("click", () => { onClick(); b.setAttribute("aria-pressed", String(!(b.getAttribute("aria-pressed") === "true"))); render(); });
  return b;
}

function buildFilters() {
  const f = document.getElementById("filters");
  const sel = document.createElement("select");
  sel.className = "chip";
  [[3e8, "감정가 3억 이하"], [3.5e8, "3.5억 이하"], [4e8, "4억 이하"], [5e8, "5억 이하"], [1e13, "전체 가격"]].forEach(([v, t]) => {
    const o = document.createElement("option"); o.value = v; o.textContent = t; if (v === state.max) o.selected = true; sel.appendChild(o);
  });
  sel.addEventListener("change", () => { state.max = Number(sel.value); render(); });
  f.appendChild(sel);
  f.appendChild(chip("관심 구역 반경 안만", state.zoneOnly, () => state.zoneOnly = !state.zoneOnly));
  f.appendChild(chip("신규만", state.newOnly, () => state.newOnly = !state.newOnly));
  f.appendChild(chip("◆ 관심 매물", state.showListings, () => state.showListings = !state.showListings, null));
  const s1 = document.createElement("span"); s1.className = "sep"; f.appendChild(s1);
  Object.entries(STATUS).forEach(([k, v]) =>
    f.appendChild(chip(v.label, state.statuses.has(k), () => state.statuses.has(k) ? state.statuses.delete(k) : state.statuses.add(k), "--" + k)));
  const s2 = document.createElement("span"); s2.className = "sep"; f.appendChild(s2);
  DATA.districts.forEach(g => f.appendChild(chip(g, state.sggs.has(g), () => state.sggs.has(g) ? state.sggs.delete(g) : state.sggs.add(g))));
}

document.getElementById("meta").textContent = `${DATA.updated} 기준 · 리치고 진행 중 경매(주거시설) · 매일 갱신`;
const missing = DATA.rows.filter(r => r.lat == null).length;
const warns = [];
if (!DATA.geocoding || missing) warns.push(`좌표를 못 찾은 물건 ${missing}건은 목록에만 표시돼요.`);
if (DATA.errors.length) warns.push(`수집 오류 ${DATA.errors.length}건: ${DATA.errors[0]}`);
if (warns.length) { const w = document.getElementById("warn"); w.hidden = false; w.textContent = warns.join(" "); }
buildFilters();
render();
</script>
</body>
</html>
