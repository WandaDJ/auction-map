534, "2026.03": 18737181, "2026.02": 18495794, "2026.01": 17475184, "2025.12": 15726211, "2025.11": 15827972}, "강동구": {}}}, "apt": {"dongs": [], "complexes": [], "gus": {"서대문구": {}, "중구": {}, "마포구": {}, "종로구": {}, "용산구": {}, "은평구": {}, "영등포구": {}, "성동구": {}, "동작구": {}, "성북구": {}, "동대문구": {}, "양천구": {}, "구로구": {}, "서초구": {}, "강남구": {}, "관악구": {}, "광진구": {}, "강서구": {}, "금천구": {}, "강북구": {}, "중랑구": {}, "송파구": {}, "도봉구": {}, "노원구": {}}}}};
const fmt = n => n == null ? "–" : n >= 1e8 ? (n / 1e8).toFixed(2).replace(/\.?0+$/, "") + "억" : Math.round(n / 1e4).toLocaleString() + "만";
const pct = (a, b) => a && b ? Math.round(a / b * 100) : null;
const state = { kind: "rh", gu: "전체", q: "", sort: "value", desc: true, view: "dong", open: null };
try { Object.assign(state, JSON.parse(localStorage.getItem("stats-filters") || "{}"), { open: null }); } catch (e) {}

document.getElementById("meta").textContent = ` ${S.updated} 기준 · 최근 ${S.months.length}개월`;

function spark(monthly) {
  const ms = S.months, vals = ms.map(m => (monthly[m] || [null])[0]);
  const ok = vals.filter(v => v != null); if (ok.length < 2) return "<span class='dim'>월별 거래가 적어 추이를 그릴 수 없어요</span>";
  const lo = Math.min(...ok), hi = Math.max(...ok), W = 360, H = 70, P = 6;
  const x = i => P + i * (W - 2 * P) / (ms.length - 1), y = v => H - P - (v - lo) / ((hi - lo) || 1) * (H - 2 * P);
  let d = "", started = false;
  vals.forEach((v, i) => { if (v == null) return; d += (started ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); started = true; });
  const dots = vals.map((v, i) => v == null ? "" : `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="var(--acc)"><title>${ms[i]} ${fmt(v)}/평 (${monthly[ms[i]][1]}건)</title></circle>`).join("");
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 평당가 추이"><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="1.6"/>${dots}</svg>
    <span class="dim">${ms[0]} ~ ${ms[ms.length - 1]} · 최저 ${fmt(lo)} / 최고 ${fmt(hi)} (전용 평당)</span>`;
}

function bar() {
  const b = document.getElementById("bar"); b.innerHTML = "";
  const chip = (label, on, fn) => { const e = document.createElement("button"); e.className = "chip"; e.textContent = label; e.setAttribute("aria-pressed", on); e.onclick = () => { fn(); save(); render(); }; b.appendChild(e); };
  chip(`빌라(연립·다세대) ${S.kinds.rh ? S.kinds.rh.dongs.length : 0}개 동`, state.kind === "rh", () => { state.kind = "rh"; state.view = "dong"; });
  chip(`아파트 ${S.kinds.apt ? S.kinds.apt.dongs.length : 0}개 동`, state.kind === "apt", () => { state.kind = "apt"; });
  if (state.kind === "apt") { chip("동별", state.view === "dong", () => state.view = "dong"); chip("단지별", state.view === "complex", () => state.view = "complex"); }
  const sel = document.createElement("select");
  const gus = [...new Set(((S.kinds[state.kind] || {}).dongs || []).map(d => d.gu))].sort();
  ["전체", ...gus].forEach(g => { const o = document.createElement("option"); o.textContent = g; if (g === state.gu) o.selected = true; sel.appendChild(o); });
  sel.onchange = () => { state.gu = sel.value; save(); render(); }; b.appendChild(sel);
  const q = document.createElement("input"); q.placeholder = "동·단지 검색"; q.value = state.q;
  q.oninput = () => { state.q = q.value.trim(); save(); renderTable(); }; b.appendChild(q);
}
const save = () => { try { localStorage.setItem("stats-filters", JSON.stringify({ kind: state.kind, gu: state.gu, q: state.q, sort: state.sort, desc: state.desc, view: state.view })); } catch (e) {} };

function cols() {
  if (state.kind === "apt" && state.view === "complex") return [
    ["name", "단지", r => `${r.name} <span class="tag">${r.dong}</span>`], ["gu", "구", r => r.gu],
    ["value", "실가치 (전용 평당)", r => fmt(r.value)], ["n", "3분기 거래", r => r.n + "건"],
    ["year", "준공", r => r.year || "–"],
    ["last", "최근 거래", r => r.last ? `${r.last.ym} ${fmt(r.last.price)} (${Math.round(r.last.area / 3.3058)}평·${r.last.floor}층)` : "–"]];
  return [
    ["dong", "동", r => r.dong], ["gu", "구", r => r.gu],
    ["value", "실가치 (전용 평당)", r => fmt(r.value)], ["n", "3분기 거래", r => r.n + "건"],
    ["price", "매매가 중앙값", r => fmt(r.price)],
    ["chg", "최근 3개월 변화", r => r.chg == null ? "<span class='dim'>–</span>" : `<span class="${r.chg > 0 ? "up" : "down"}">${r.chg > 0 ? "+" : ""}${r.chg}%</span>`],
    ...(state.kind === "rh" ? [["land", "지분 평당", r => fmt(r.land)]] : []),
    ["appraised", "감정가 / 실가치", r => r.appraised ? `${pct(r.appraised[0], r.value)}% <span class="dim">(${r.appraised[1]}건)</span>` : "<span class='dim'>–</span>"],
    ["lowest", "경매 최저가 / 실가치", r => r.lowest ? `${pct(r.lowest[0], r.value)}%` : "<span class='dim'>–</span>"],
    ...(state.kind === "rh" ? [["asking", "호가 / 실가치", r => r.asking ? `${pct(r.asking[0], r.value)}% <span class="dim">(${r.asking[1]}건)</span>` : "<span class='dim'>–</span>"]] : [])];
}
const sortVal = (r, k) => ["appraised", "lowest", "asking"].includes(k) ? (r[k] ? r[k][0] / r.value : null) : k === "last" ? (r.last || {}).ym : r[k];

function renderTable() {
  const K = S.kinds[state.kind];
  const tbl = document.getElementById("tbl");
  if (!K || !K.dongs.length) {
    tbl.innerHTML = `<tr><td class="empty">${state.kind === "apt" ? "아파트 실거래가 아직 없어요 — data.go.kr에서 '국토교통부_아파트 매매 실거래가 상세 자료'를 활용 신청하면 다음 갱신부터 채워져요." : "데이터가 아직 없어요."}</td></tr>`;
    document.getElementById("sub").textContent = ""; return;
  }
  const C = cols();
  let rows = (state.kind === "apt" && state.view === "complex" ? K.complexes : K.dongs)
    .filter(r => (state.gu === "전체" || r.gu === state.gu) && (!state.q || (r.dong + (r.name || "") + r.gu).includes(state.q)));
  rows.sort((a, b) => { const x = sortVal(a, state.sort), y = sortVal(b, state.sort); if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * (state.desc ? -1 : 1); });
  document.getElementById("sub").textContent = `${rows.length}곳 · 행을 누르면 월별 추이${state.kind === "apt" && state.view === "complex" ? "와 평형별 시세" : ""}`;
  const head = `<tr>${C.map(([k, t]) => `<th data-k="${k}">${t}${state.sort === k ? (state.desc ? " ▼" : " ▲") : ""}</th>`).join("")}</tr>`;
  const body = rows.slice(0, 400).map((r, i) => {
    const id = `${r.gu}|${r.dong}|${r.name || ""}`;
    let tr = `<tr class="row" data-id="${id}">${C.map(([, , f]) => `<td>${f(r)}</td>`).join("")}</tr>`;
    if (state.open === id) {
      let inner = r.monthly ? spark(r.monthly) : "";
      if (r.areas) inner += `<div style="margin-top:6px">${Object.entries(r.areas).map(([py, [p, n]]) => `<span class="tag">전용 ${py}평 ${fmt(p)} (${n}건)</span>`).join(" ")}</div>`;
      if (r.appraised) inner += `<div class="dim" style="margin-top:6px">경매 감정가 전용 평당 ${fmt(r.appraised[0])} · 최저가 ${r.lowest ? fmt(r.lowest[0]) : "–"} · 실가치 ${fmt(r.value)}</div>`;
      if (r.asking) inner += `<div class="dim">네이버 호가 전용 평당 ${fmt(r.asking[0])} (${r.asking[1]}건)</div>`;
      tr += `<tr class="detail"><td colspan="${C.length}">${inner || "<span class='dim'>추가 정보 없음</span>"}</td></tr>`;
    }
    return tr;
  }).join("");
  tbl.innerHTML = head + body;
  tbl.querySelectorAll("th").forEach(th => th.onclick = () => { const k = th.dataset.k; state.desc = state.sort === k ? !state.desc : true; state.sort = k; save(); renderTable(); });
  tbl.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => { state.open = state.open === tr.dataset.id ? null : tr.dataset.id; renderTable(); });
}
function render() { bar(); renderTable(); }
render();
</script>
